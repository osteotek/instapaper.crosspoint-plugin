name: Release

# Pushing a vX.Y.Z tag publishes the GitHub Release that Plugin Hub installs
# from, with the notes from CHANGELOG.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Check the tag matches the manifest version
        run: |
          version=$(node -p "require('./instapaper.crosspoint-plugin/manifest.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version." >&2
            exit 1
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.mjs "$version" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Articles for Instapaper $version" --notes-file notes.md
